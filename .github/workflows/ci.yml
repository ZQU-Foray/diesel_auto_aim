# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
# 各作业先探测适用文件是否存在，不存在即跳过（空仓也能绿灯）。
# 本仓可按实际技术栈调整；不适用的作业可直接删除。
#
# 设计原则：**空仓库必须绿灯**。
#   每个作业先探测自己适用的文件是否存在，不存在就跳过。
#   这样新仓在初始化当天就能接入 CI，而不会因为「还没有代码」而长期红着
#   —— 长期的红灯会让人习惯性忽略 CI，等于没有 CI。
#
# 更新记录：
#   - 增加 ROS 2 (colcon) 构建与测试作业；仓库内无 ROS 2 package 时自动跳过，
#     因此可安全地保留在通用模板中，不影响纯 Python / 纯 C 仓库。
#   - 为 lint-python / lint-c / test-python 补上同样的探测与跳过逻辑。
#     修正原模板在空仓库上必然失败的两处：
#       1) `pip install -r requirements.txt` —— 文件不存在时直接报错退出；
#       2) `find ... | xargs clang-format` —— 空输入时 xargs 仍会执行一次无参命令。
#   - 修正 find 的 -o 与 -not 优先级问题（补括号），并为 xargs 加 -r / -print0。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- Python 代码检查 ----
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        run: ruff check .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查 ----
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 C/C++ 代码
        id: detect
        shell: bash
        run: |
          if find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 C/C++ 代码，跳过。"
          fi

      # 固定 clang-format 版本：ubuntu-latest 的 apt 版本会随镜像漂移（曾从 14 漂到 21），
      # 同一份代码在不同镜像上判不一致，格式检查会变成噪声。本地用同一版本：
      #   pip install clang-format==18.1.8
      - name: Install clang-format
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages clang-format==18.1.8
          CF=$(python3 -c "import clang_format, pathlib; print(pathlib.Path(clang_format.__file__).parent / 'data' / 'bin' / 'clang-format')")
          echo "CLANG_FORMAT=$CF" >> "$GITHUB_ENV"
          "$CF" --version

      - name: Format check
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -not -path './.git/*' -print0 | \
            xargs -0 -r "$CLANG_FORMAT" --dry-run --Werror

  # ---- Python 测试 ----
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 测试
        id: detect
        shell: bash
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 测试，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -v

  # ---- ROS 2 构建与测试 ----
  # 适用于 colcon 工作空间仓库（如 diesel_navigation）。
  # 仓库内不存在 package.xml 时整个作业自动跳过，故可安全保留在通用模板里。
  build-ros2:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否为 ROS 2 仓库
        id: detect
        shell: bash
        run: |
          if find . -name package.xml -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 ROS 2 package，跳过 ROS 2 构建。"
          fi

      - name: 安装依赖 (rosdep)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          apt-get update
          rosdep update
          # diesel_platform_core 不在 rosdep 索引里，由下一步从上游仓构建
          rosdep install -y -r --from-paths . --ignore-src --rosdistro humble \
            --skip-keys diesel_platform_core

      # 本仓只依赖 diesel_platform_core 一个上游 ROS 2 包；CI 单仓 checkout 拿不到它，
      # 故从公开的 diesel_platform 仓按需构建该子包，再把安装前缀交给后续步骤的 find_package。
      - name: 准备上游 diesel_platform_core
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          # 默认分支只有文档，平台子包在 dev 上
          git clone --depth 1 --branch dev https://github.com/ZQU-Foray/diesel_platform.git /tmp/diesel_platform
          colcon build --base-paths /tmp/diesel_platform \
            --packages-select diesel_platform_core \
            --build-base /tmp/diesel_platform/build \
            --install-base /tmp/diesel_platform/install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          # colcon 的隔离布局是 install/<pkg>，前缀要指到子包目录
          PLAT_PREFIX=/tmp/diesel_platform/install/diesel_platform_core
          test -f "$PLAT_PREFIX/lib/cmake/diesel_platform_core/diesel_platform_coreConfig.cmake"
          # 后续步骤是独立 shell，sourcing 不会继承；用 env 把前缀传给 CMake 与动态链接器
          echo "CMAKE_PREFIX_PATH=$PLAT_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PLAT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: 构建 (colcon build)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: 测试 (colcon test)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
